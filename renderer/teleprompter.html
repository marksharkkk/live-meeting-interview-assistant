<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8000 ws://127.0.0.1:8000; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="styles/teleprompter.css">
</head>
<body>
  <div class="teleprompter-container">
    <div class="teleprompter-header">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
      <div class="privacy-badge">👁️ 隐私模式</div>
      <div class="window-controls">
        <button class="control-btn" id="btn-privacy" title="隐私模式(Ctrl+H)">🛡️</button>
        <button class="control-btn" id="btn-history" title="答案历史">📜</button>
        <button class="control-btn" id="btn-export" title="导出会议记录">⬇</button>
        <button class="control-btn" id="btn-clear" title="Clear">🗑️</button>
        <button class="control-btn" id="btn-minimize" title="Minimize">─</button>
        <button class="control-btn" id="btn-close" title="Close">×</button>
      </div>
    </div>

    <div class="shortcuts-hint">
      <span class="kbd">Ctrl+Shift+H</span> 显示/隐藏提词器 | <span class="kbd">Ctrl+H</span> 隐私模式 | <span class="kbd">Esc</span> 隐藏窗口
    </div>

    <div class="controls-section">
      <button class="control-btn-large primary" id="btn-start">开始监听</button>
      <button class="control-btn-large" id="btn-answer">生成答案</button>
      <button class="control-btn-large" id="btn-regenerate" style="display: none;">重新生成</button>
      <button class="control-btn-large warning" id="btn-resume" style="display: none;">继续监听</button>
    </div>

    <div class="current-answer-section">
      <div class="section-label">当前答案:</div>
      <div id="answer-label" class="answer-label">等待问题...</div>
      <div id="current-answer" class="current-answer"></div>
    </div>

    <div class="transcript-section">
      <div class="section-label">实时转录:</div>
      <div id="transcript-container" class="transcript-container" contenteditable="true" spellcheck="false"></div>
    </div>

    <div id="history-panel" class="history-panel hidden">
      <div class="history-header">
        <span>答案历史</span>
        <button class="control-btn" id="btn-close-history" title="关闭">×</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <div class="loading-text">Generating answer...</div>
  </div>

  <script src="scripts/teleprompter.js"></script>
</body>
</html>
