<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:8000 ws://127.0.0.1:8000; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>会议工作台</title>
  <link rel="stylesheet" href="styles/teleprompter.css">
  <link rel="stylesheet" href="styles/workbench.css">
</head>
<body class="workbench">
  <div class="teleprompter-container">
    <header class="teleprompter-header">
      <div class="status-indicator"><span class="status-dot"></span><span class="status-text">就绪</span></div>
      <div class="privacy-badge">隐私模式</div>
      <div class="window-controls">
        <button class="control-btn" id="btn-privacy" title="隐藏 / 恢复全部窗口（Ctrl+H）">🛡️</button>
        <button class="control-btn" id="btn-history" title="最近答案历史">📜</button>
        <button class="control-btn" id="btn-export" title="导出当前会话字幕和问答">⬇</button>
        <button class="control-btn" id="btn-clear" title="清空字幕显示（不删除存档）">🗑</button>
        <button class="control-btn" id="btn-minimize" title="最小化">─</button>
        <button class="control-btn" id="btn-maximize" title="最大化 / 还原">□</button>
        <button class="control-btn" id="btn-close" title="关闭工作台">×</button>
      </div>
    </header>
    <section class="session-toolbar" aria-label="记录控制">
      <input id="meeting-title" placeholder="本场记录名称" maxlength="200" aria-label="本场记录名称">
      <label><input id="meeting-audio" type="checkbox" checked>保存音频</label>
      <button id="meeting-start" class="primary" disabled>开始</button>
      <button id="btn-start" disabled>暂停</button>
      <button id="meeting-finish" disabled>结束并保存</button>
      <button id="toggle-ai" aria-expanded="true">收起 AI 侧栏</button>
    </section>
    <details class="capture-settings">
      <summary>音源与语言 <span id="capture-description">加载设置…</span></summary>
      <div class="language-controls">
        <label>音源<select id="capture-device"><option value="-1">自动（系统音频回环）</option></select></label>
        <label>识别语言<select id="capture-language"><option value="auto">自动检测（中英文等）</option><option value="zh-CN">中文</option><option value="en-US">英文</option><option value="ja-JP">日语</option><option value="ko-KR">韩语</option></select></label>
        <label>字幕翻译<select id="translation-target"><option value="auto">中英互译</option><option value="zh">翻成中文</option><option value="en">翻成英文</option><option value="off">关闭翻译</option></select></label>
      </div>
      <p>音源和识别语言在暂停后可修改。中文译英文缺少本地模型时，使用主界面配置的在线模型。</p>
    </details>
    <div id="meeting-status" role="status">点击开始后自动保存原始文字；AI 生成期间仍继续记录。</div>
    <main class="workspace-panels">
      <section class="transcript-section">
        <div class="section-heading"><div class="section-label">实时字幕 · 原文与翻译</div><button class="section-action" id="btn-expand-transcript" title="展开字幕" aria-pressed="false">⛶</button></div>
        <div id="transcript-container" class="transcript-container" contenteditable="true" spellcheck="false" aria-label="实时字幕"></div>
      </section>
      <aside id="ai-sidebar">
        <nav class="view-switch" aria-label="AI 工具"><button id="view-meeting" class="selected" aria-pressed="true">总结</button><button id="view-interview" aria-pressed="false">回答辅助</button></nav>
        <section class="meeting-panel" id="summary-panel">
          <label><input id="meeting-live" type="checkbox">实时总结（每分钟，默认关闭）</label>
          <p>实时总结基于截至当时的完整原文；结束记录后可生成最终总结。</p>
          <div class="meeting-actions">
            <select id="meeting-select" aria-label="按场次选择历史记录"></select>
            <button id="meeting-refresh">刷新场次</button><button id="meeting-summary">生成完整总结</button>
            <button id="meeting-original">查看原始记录</button><button id="meeting-bilingual">查看中英对照</button>
            <button id="meeting-answers">查看本场问答</button><button id="meeting-download">下载原始记录</button>
            <button id="meeting-save-summary">下载完整总结</button><button id="meeting-save-bilingual">下载中英对照</button>
            <button id="meeting-save-answers">下载本场问答</button>
          </div>
          <div id="meeting-tracks"></div><div id="summary-source" class="source-note"></div><pre id="meeting-content">暂无总结</pre>
        </section>
        <section class="current-answer-section" id="answer-panel" hidden>
          <label for="question-draft">本次问题（可编辑，也可在字幕中选中文字）</label>
          <textarea id="question-draft" rows="4" maxlength="10000" placeholder="默认选取最近提问；无明确问句时使用最近字幕，请确认后生成。"></textarea>
          <div class="answer-tools"><button id="use-selection">使用选中字幕</button><button id="use-latest">提取最近问题</button></div>
          <label>回答语言<select id="answer-language"><option value="auto">跟随问题</option><option value="zh">中文</option><option value="en">英文</option></select></label>
          <div class="answer-tools"><button id="btn-answer" class="primary">生成答案</button><button id="btn-regenerate" disabled>重新生成</button></div>
          <div id="answer-label" class="answer-label">等待问题</div><div id="loading-overlay" class="hidden" role="status">正在生成答案，字幕继续记录…</div>
          <div id="current-answer" class="current-answer" aria-live="polite"></div>
        </section>
      </aside>
    </main>
    <div id="history-panel" class="history-panel hidden">
      <div class="history-header"><span>最近答案历史（本场问答另存于场次记录）</span><div class="history-actions"><button id="btn-clear-history" class="history-clear-btn">清空</button><button id="btn-close-history" class="control-btn" title="关闭">×</button></div></div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>
  <script src="scripts/teleprompter.js"></script><script src="scripts/meetings.js"></script><script src="scripts/workspace-layout.js"></script>
</body>
</html>
