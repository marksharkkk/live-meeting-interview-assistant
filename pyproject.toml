[project]
name = "meeting-assistant-backend"
version = "1.0.0"
description = "Python backend for Meeting Assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.109.0,<1",
    "uvicorn>=0.27.0,<1",
    "openai>=1.12.0,<3",
    "python-multipart>=0.0.6,<1",
    "langchain-core>=0.1.0,<2",
    "langchain-community>=0.0.20,<1",
    "langchain-text-splitters>=0.0.1,<1",
    "pyaudio>=0.2.14,<1",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "faster-whisper>=1.0,<2",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "docx2txt>=0.8,<1",
    "pypdf>=4,<7",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
